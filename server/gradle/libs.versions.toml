# 版はここ 1 か所。Dependabot の gradle ecosystem がこのファイルを読む。
#
# ★ ライブラリの version を書かないのは意図的。spring-boot-dependencies の BOM
#   （下の spring-boot-bom）が解決するので、starter の版は Boot の版に必ず追随する。
#   個別に書くと BOM とずれた組み合わせを作れてしまう。

[versions]
kotlin = "2.4.10"
springBoot = "4.1.1"
# Anthropic の公式 Java SDK（段階11-2b）。**BOM の管理外**なので版をここに書く。
# Kotlin は Java SDK を使う（専用の Kotlin SDK は無い）。
anthropic = "2.57.0"
# ★ BOM が決める版を上書きする唯一の依存（2026-09-04。#105）。上の「個別に書かない」への例外。
#   Spring Boot 4.1.1 の BOM は tomcat 11.0.24 を指すが、11.0.24 には critical 3 件がある
#   —— CVE-2026-68525（cvss 9.1）/ CVE-2026-65905（9.8）/ CVE-2026-65182（9.1）。
#   いずれも 11.0.25 で修正され、**安定版の Boot は 4.1.1 が最新**（次は 4.2.0-M1 のみ。
#   同日 Maven Central 実測）なので、**BOM 経由で 11.0.25 を得る経路が無い**。
#   Dependabot も直せない —— 版がここに無いので security_update_dependency_not_found で
#   2 本とも失敗した（2026-09-03 実測）。
#   ★ 外す条件: Boot の BOM が 11.0.25 以上を指す版へ上がったら、この version と
#     下の 3 libraries、build.gradle.kts の constraints を消して BOM に戻す。
tomcat = "11.0.25"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# all-open。@Configuration / @SpringBootApplication は CGLIB がサブクラス化するので、
# Kotlin の既定（final）のままだと動かない。
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }

[libraries]
# Spring の @ConfigurationProperties は constructor binding のためにパラメータ名と
# 既定値を kotlin-reflect 越しに読む（無いと ClassNotFoundException:
# kotlin.reflect.jvm.ReflectJvmMapping で Bean 生成が落ちる）。Kotlin + Spring の必須依存。
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
postgresql = { module = "org.postgresql:postgresql" }
mysql = { module = "com.mysql:mysql-connector-j" }
h2 = { module = "com.h2database:h2" }
# AI proxy が上流を叩く唯一の依存（段階11-2b）。HTTP を直接組まないのは、
# structured outputs / prompt caching / エラーの型が SDK 側で保たれるため。
anthropic = { module = "com.anthropic:anthropic-java", version.ref = "anthropic" }
# 上の tomcat の注記を参照。**constraints でのみ使う**（依存として足すのではない）——
# starter-web が引く 3 本の版だけを引き上げる。3 本まとめて揃えるのは、
# starter-tomcat が core / el / websocket を同じ版で引くため（gradle.lockfile:44-46）。
tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }
tomcat-embed-el = { module = "org.apache.tomcat.embed:tomcat-embed-el", version.ref = "tomcat" }
tomcat-embed-websocket = { module = "org.apache.tomcat.embed:tomcat-embed-websocket", version.ref = "tomcat" }
