# grabado backend（server/）の検査。**paths で絞って**回す型
# （propagandist/.github の workflow-templates/ci-heavy の考え方）。
#
# ★ なぜ frontend と別ワークフローなのか
#   `paths` は **`on:` にしか書けず、ジョブ単位では絞れない**。ジョブ内の `if:` で飛ばしても
#   **起動した時点で 1 分は課金される**（床が残る）。**ワークフローごと起動しなければ 0 分**
#   ——だから分ける。Kotlin を 1 行も触らない PR で Gradle を回さないのが目的。
#
# ★ GitHub の「Automatic dependency submission」を**有効にしない**
#   Settings → Advanced Security → Dependency graph の自動提出機能は、**Gradle プロジェクトで
#   全ブランチの全 push に走る**。org の実測（cartera）では 9.5 日で 123 回・**月換算 1,100 分＝
#   org 全体の枠 2,000 分の半分以上**を単独で消費していた。依存グラフが使われるのは
#   default branch だけなのに、である。
#   必要になったら `gradle/actions/dependency-submission` を **default branch への push かつ
#   Gradle のファイルが変わったときだけ**動かす自前ワークフローに置き換えること。
#   **★ 置き換えた**（2026-08-26。段階2-5）—— `.github/workflows/deps-submit.yml`。
#   契機は Dependabot の **security** updates を `server/` に効かせること
#   （**GitHub は `gradle.lockfile` を読めない**ので、解決済みグラフを渡さないと
#   CVE の修正 PR が `server/` には出ない）。**上の「枠」の根拠は public 化で効かなくなったが**
#   （public の標準ランナーは枠を消費しない。2026-08-26 実測）、**結論は変わらない**
#   —— 同じ結果を出すために全ブランチの全 push で走らせる理由が、枠とは別に無い。
#
# ★ wrapper は毎回検証する
#   `validate-wrappers: true` が `gradle-wrapper.jar` を Gradle の既知リリースのハッシュと
#   突き合わせる。60KB の不透明なバイナリを分類 B のリポジトリに置く懸念は、これで
#   「検証済みバイナリ」に変わる。`gradle-wrapper.properties` の `distributionSha256Sum` と
#   合わせて 2 段。
#
# 判断規約: propagandist/.github の docs/ci-strategy.md
name: CI (server)

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'server/**'
      - 'tests/contract/**'
      # ★ ReviewSchemaTest が **Kotlin からフロントのソースを読む**唯一の箇所（§11 の
      #   語彙が両側でずれていないことを見る）。**入力なので paths に要る** ——
      #   段階2-6 の集約でこのパスが動いたとき、ここに無かったせいで
      #   **フロントだけを触った PR では気づけない**状態になっていた。
      #   ci-frontend.yml が SecurityHeadersFilter.kt を列挙しているのと同じ形。
      - 'frontend/js/io/ai/suggestion.ts'
      # ★ 実 HTTP の E2E（#319）の入力。**package.json は入れない** ——
      #   npm の依存は ci-frontend が既に見ており、壊れていればそちらで先に落ちる。
      #   ここへ足すと、**フロントだけを触った PR で server のジョブまで回る**。
      - 'tests/server/**'
      - 'playwright.server.config.ts'
      - 'scripts/build-server.mjs'
      - '.github/workflows/ci-server.yml'

permissions:
  contents: read

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 検査
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # gradle-wrapper.jar が Gradle の既知リリースと一致することを毎回確かめる。
          validate-wrappers: true

      # ★ ここから下は実 HTTP の E2E（#319）のため。**jar に直接 HTTP を投げる層は
      #   ここにしか無い** —— ci-server は Kotlin のテストまで、ci-image は Docker、
      #   ci-frontend は仮想 backend を見ている。**3 日間赤いままだった実績がある**
      #   （CUSTOMIZATIONS.md の 2026-09-09）。
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: 依存の取得
        run: npm ci

      # `build` は compile ＋ test ＋ bootJar まで通す。依存ロック（gradle.lockfile）が
      # 効いているので、ロックに無い依存が紛れ込めばここで落ちる。
      - name: ビルドとテスト
        run: ./gradlew build --no-daemon
        working-directory: server

      # ロックファイルが実際の依存グラフと一致していること。--write-locks を
      # 忘れたまま依存を足した PR をここで捕まえる。
      # ★★ **Chromium が要る**（2026-09-16 実測）—— #319 は「HTTP を投げるだけなので
      #   ブラウザは起動しない」と見ていたが、**tests/server/ の 7 本すべてが page fixture を
      #   使っている**（実ブラウザの XHR → vite dev proxy → jar、を通しで見る層なので当然だった）。
      # ★ **キーは ci-frontend.yml / ci-image.yml と同じ**。片方が温めたものをもう片方が使う。
      #   **restore-keys は置かない**（前方一致で古いブラウザを復元するのを避ける。#121）。
      # ★ **空振りを緑にしない** —— 版が読めなければ落とす。
      - name: Playwright の版を読む（キャッシュのキー）
        id: playwright
        run: |
          version="$(npx playwright --version | awk '{print $2}')"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "playwright --version が読めない: '$version'" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Chromium のキャッシュ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-chromium

      - name: Chromium の取得
        run: npx playwright install --with-deps chromium

      # jar は上の build が作っている（bootJar）。npm run test:server は build:server を
      # 前段に持つので、**同じ jar を作り直すぶんだけ重複する** —— それでもここで呼ぶのは、
      # **script の中身（起こし方・待ち方・片付け）を CI 側に写さない**ため。
      - name: 実 HTTP の E2E（jar に直接投げる）
        run: npm run test:server
      - name: 追跡ファイルが動いていないこと
        run: git diff --exit-code
