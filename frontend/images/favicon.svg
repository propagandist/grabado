<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="grabado">
  <!--
    grabado の favicon（§6.4）。2 つの実体を関係で結ぶ ＝ ER 図の核。

    ★ 寸法は 16px（タブ）から逆算する。viewBox が 32 なので **2 単位 = 1px**。
      面・帯・隙間の下限は **3 単位（1.5px）** —— 最初の案は見出し帯を 1.6 単位で描き、
      16px では 0.8px になって消え、白い箱が 2 つ並ぶだけになった。

    ★ ただし **リレーション線だけは例外で 2.2**（1.1px）。下限の規則を線にも当てると
      4 単位まで太らせることになり、**線は箱と同じ白なので融合して「ジグザグの塊」になる**。
      「16px で消えないこと」と「線に見えること」は別の要求で、太さは
      **箱の高さとの比（10 : 2.2 ≒ 4.5 : 1）** で決める。

    ★ 曲線は frontend/js/relation.ts の redrawNormal と同じ式
      （`M p1 C (p1+half) … (p2-half) … p2` ＝ 両端から軸方向へ出て中間で S 字）。
      **アプリが実際に描いている線と同じ形**にしてある。half = 端点間の距離の半分 = 2.5。
      副次的に、**S 字は端点での接線が箱の辺に垂直**なので butt cap の切り口が辺と平行になり、
      **直線のときに起きた「角が箱からはみ出す」が原理的に起きない**（線を箱へ食い込ませる細工が要らない）。

    ★ 色は frontend/styles/material-inspired.css のアクセントから採った。
      **新しいブランド色を作らない** —— 作れば UI と favicon で色の正本が 2 つになる。

    ★ script を持たない（CSP は img-src 'self' data: のままで足りる）。
  -->
  <rect width="32" height="32" rx="7" fill="#de2665"/>
  <path d="M9.5 13.5C9.5 16 22.5 16 22.5 18.5" fill="none" stroke="#fff" stroke-width="2.2"/>
  <g fill="#fff">
    <rect x="2.5" y="3.5" width="14" height="10" rx="2"/>
    <rect x="15.5" y="18.5" width="14" height="10" rx="2"/>
  </g>
</svg>
