<html>

<head>
    <title>grabado</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1" />
    <meta charset="utf-8" />
    <!-- grabado: #169。title を持たない = applyStyle() が切り替えないので常に効く。
         media="all" は必須（無いと Vite が CSS モジュールとして JS グラフへ取り込む） -->
    <link rel="stylesheet" href="styles/base.css" media="all" />
    <link rel="stylesheet" href="styles/icons.css" media="all" />
    <link rel="stylesheet" title="material-inspired" href="styles/material-inspired.css" media="all" />
    <!-- grabado: #172。rel を必ず書く —— applyStyle() の getAttribute("rel")! が non-null 前提 -->
    <link rel="alternate stylesheet" title="material-dark" href="styles/material-dark.css" media="all" />
    <link rel="alternate stylesheet" title="original" href="styles/original.css" media="all" />
    <link rel="stylesheet" href="styles/print.css" type="text/css" media="print" />

    <!-- grabado: 段階4-3a で dropbox.js の CDN 読み込みを撤去した。外部依存はこれで 0 本 -->
    <!-- grabado: js/*.js の読み込みと初期化は src/main.ts に集約（HANDOVER §3 段階1） -->
    <script type="module" src="/src/main.ts"></script>
</head>

<body>
    <div id="area"></div>

    <div id="controls">
        <div id="bar">
            <div id="toggle"></div>
            <span class="tb i-undo"><input type="button" id="undo" /></span>
            <span class="tb i-redo"><input type="button" id="redo" /></span>

            <hr />

            <span class="tb i-saveload"><input type="button" id="saveload" /></span>

            <hr />

            <span class="tb i-addtable"><input type="button" id="addtable" /></span>
            <span class="tb i-edittable"><input type="button" id="edittable" /></span>
            <span class="tb i-tablekeys"><input type="button" id="tablekeys" /></span>
            <span class="tb i-removetable"><input type="button" id="removetable" /></span>
            <span class="tb i-cleartables"><input type="button" id="cleartables" /></span>

            <hr />

            <span class="tb i-addrow"><input type="button" id="addrow" /></span>
            <span class="tb i-editrow"><input type="button" id="editrow" /></span>
            <span class="tb i-uprow"><input type="button" id="uprow" class="small" /></span><span class="tb i-downrow"><input type="button" id="downrow" class="small" /></span>
            <span class="tb i-foreigncreate"><input type="button" id="foreigncreate" /></span>
            <span class="tb i-foreignconnect"><input type="button" id="foreignconnect" /></span>
            <span class="tb i-foreigndisconnect"><input type="button" id="foreigndisconnect" /></span>
            <span class="tb i-removerow"><input type="button" id="removerow" /></span>

            <hr />

            <span class="tb i-options"><input type="button" id="options" /></span>
            <a href="https://github.com/propagandist/grabado#readme" target="_blank" rel="noopener noreferrer"><span class="tb i-docs"><input type="button" id="docs"
                    value="" /></span></a>
        </div>

        <div id="rubberband"></div>

        <div id="minimap"></div>

        <!--
            grabado: #173。#background は消えた —— <dialog> の ::backdrop が担う。
            aria-modal / フォーカストラップ / Esc も showModal() が標準で持つ。
        -->
        <dialog id="window" aria-labelledby="windowtitle">
            <div id="windowtitle">
                <img id="throbber" src="images/throbber.gif" alt="" title="" />
            </div>
            <div id="windowcontent"></div>
            <span class="tb i-windowok"><input type="button" id="windowok" /></span>
            <span class="tb i-windowcancel"><input type="button" id="windowcancel" /></span>
        </dialog>
    </div>
    <!-- #controls -->

    <div id="opts">
        <table role="presentation">
            <tbody>
                <tr>
                    <td>* <label id="language" for="optionlocale"></label></td>
                    <td>
                        <select id="optionlocale">
                            <option></option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>* <label id="db" for="optiondb"></label></td>
                    <td>
                        <select id="optiondb">
                            <option></option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label id="snap" for="optionsnap"></label>
                    </td>
                    <td>
                        <input type="text" size="4" id="optionsnap" aria-describedby="optionsnapnotice" />
                        <span class="small" id="optionsnapnotice"></span>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label id="pattern" for="optionpattern"></label>
                    </td>
                    <td>
                        <input type="text" size="6" id="optionpattern" aria-describedby="optionpatternnotice" />
                        <span class="small" id="optionpatternnotice"></span>
                    </td>
                </tr>
                <tr>
                    <td>* <label id="style" for="optionstyle"></label></td>
                    <td>
                        <select id="optionstyle">
                            <option></option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label id="hide" for="optionhide"></label>
                    </td>
                    <td>
                        <input type="checkbox" id="optionhide" />
                    </td>
                </tr>
                <tr>
                    <td>* <label id="vector" for="optionvector"></label></td>
                    <td>
                        <input type="checkbox" id="optionvector" />
                    </td>
                </tr>
                <tr>
                    <td>* <label id="showsize" for="optionshowsize"></label></td>
                    <td>
                        <input type="checkbox" id="optionshowsize" />
                    </td>
                </tr>
                <tr>
                    <td>* <label id="showtype" for="optionshowtype"></label></td>
                    <td>
                        <input type="checkbox" id="optionshowtype" />
                    </td>
                </tr>
            </tbody>
        </table>

        <hr />

        * <span class="small" id="optionsnotice"></span>
    </div>

    <!--
      grabado: #312。**行き先ごとの fieldset を縦に積む。**

      ★★ **2 列（クライアント / サーバ）は「どちら側で処理するか」で、利用者が最初に
        決めることではない。** 実際、サーバ欄には保存でも読み込みでもない DB 取り込みと
        AI 2 個が同居していた（置き場所を実装の所在で決めた結果）。18 個は設計されたのでは
        なく、2008 年の 7 個へ 18 年ぶん積み上がったもの。

      ★★ **ボタンの id・種類・数は 1 つも変えていない。** id は js/io.ts の ids 配列が
        OZ.$(id) で引き、elm.value = _(id) を当てる鍵で、**変えると Designer の初期化が
        落ちる**。動いたのは**並び順と、それを束ねる legend だけ**。

      ★ **legend の id は未訳時にそのまま出る**（globals.ts の _() は無いキーを返す）。
        訳すのは ja / en の 2 本だけなので（#235 の前例）、**キー名が読める英単語であること**が
        要件。`ai` は既に「自動採番」で埋まっているので `assistant` にした。
    -->
    <div id="io">
        <fieldset>
            <legend id="file"></legend>
            <div class="io-row">
                <span class="tb i-clientdownload"><input type="button" id="clientdownload" /></span>
                <span class="tb i-clientloadfromfile"><input type="button" id="clientloadfromfile" /></span>
            </div>
        </fieldset>
        <fieldset>
            <legend id="browser"></legend>
            <div class="io-row">
                <span class="tb i-clientlocalsave"><input type="button" id="clientlocalsave" /></span>
                <span class="tb i-clientlocalload"><input type="button" id="clientlocalload" /></span>
                <span class="tb i-clientlocallist"><input type="button" id="clientlocallist" /></span>
            </div>
        </fieldset>
        <fieldset>
            <legend id="server"></legend>
            <div class="io-row">
                <span class="tb i-serversave"><input type="button" id="serversave" /></span>
                <span class="tb i-quicksave"><input type="button" id="quicksave" /></span>
                <span class="tb i-serverload"><input type="button" id="serverload" /></span>
                <span class="tb i-serverlist"><input type="button" id="serverlist" /></span>
            </div>
        </fieldset>
        <fieldset>
            <legend id="clipboard"></legend>
            <div class="io-row">
                <span class="tb i-clientcopy"><input type="button" id="clientcopy" /></span>
                <span class="tb i-clientpaste"><input type="button" id="clientpaste" /></span>
            </div>
        </fieldset>
        <fieldset>
            <legend id="database"></legend>
            <div class="io-row">
                <span class="tb i-serverimport"><input type="button" id="serverimport" /></span>
            </div>
        </fieldset>
        <fieldset>
            <legend id="assistant"></legend>
            <div class="io-row">
                <span class="tb i-aireview"><input type="button" id="aireview" /></span>
                <span class="tb i-aiapply"><input type="button" id="aiapply" /></span>
            </div>
        </fieldset>
        <fieldset>
            <legend id="generate"></legend>
            <!-- 出す先を選ぶ select と、出すボタンを 1 行にする（2 行ぶんの縦を使わない） -->
            <div class="io-pick">
                <label for="outputdb" id="outputdblabel"></label>
                <select id="outputdb"></select>
                <span class="tb i-clientsql"><input type="button" id="clientsql" /></span>
            </div>
            <div class="io-pick">
                <select id="ormtarget"></select>
                <span class="tb i-clientorm"><input type="button" id="clientorm" /></span>
            </div>
        </fieldset>
        <fieldset>
            <legend id="output"></legend>
            <!--
              grabado: #312。**欄を読み書きする 2 個は欄の隣に置く。**
              辞書 `empty` の「下の入出力欄に JSON データを貼りつけてから実行してください」は、
              **この 2 個に限っては正しい説明になる。**
            -->
            <div class="io-row">
                <span class="tb i-clientsave"><input type="button" id="clientsave" /></span>
                <span class="tb i-clientload"><input type="button" id="clientload" /></span>
            </div>
            <textarea id="textarea" rows="1" cols="1"></textarea>
            <!--modified by javascript later-->
        </fieldset>
    </div>

    <div id="keys">
        <fieldset>
            <legend id="keyslistlabel"></legend>
            <select id="keyslist">
                <option></option>
            </select>
            <span class="tb i-keyadd"><input type="button" id="keyadd" /></span>
            <span class="tb i-keyremove"><input type="button" id="keyremove" /></span>
        </fieldset>
        <fieldset>
            <legend id="keyedit"></legend>
            <table role="presentation">
                <tbody>
                    <tr>
                        <td>
                            <label for="keytype" id="keytypelabel"></label>
                            <select id="keytype">
                                <option></option>
                            </select>
                        </td>
                        <td></td>
                        <td>
                            <label for="keyname" id="keynamelabel"></label>
                            <input type="text" id="keyname" size="10" />
                        </td>
                    </tr>
                    <tr>
                        <td colspan="3">
                            <hr />
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="keyfields" id="keyfieldslabel"></label><br />
                            <select id="keyfields" size="5" multiple="multiple">
                                <option></option>
                            </select>
                        </td>
                        <td>
                            <span class="tb i-keyleft"><input type="button" id="keyleft" value="&lt;&lt;" /></span><br />
                            <span class="tb i-keyright"><input type="button" id="keyright" value="&gt;&gt;" /></span><br />
                        </td>
                        <td>
                            <label for="keyavail" id="keyavaillabel"></label><br />
                            <select id="keyavail" size="5" multiple="multiple">
                                <option></option>
                            </select>
                        </td>
                    </tr>
                </tbody>
            </table>
        </fieldset>
    </div>

    <div id="table">
        <table role="presentation">
            <tbody>
                <tr>
                    <td>
                        <label id="tablenamelabel" for="tablename"></label>
                    </td>
                    <td>
                        <input id="tablename" type="text" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label id="tablecommentlabel" for="tablecomment"></label>
                    </td>
                    <td>
                        <textarea rows="5" cols="40" id="tablecomment"></textarea>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- grabado: new SQL.Designer() と setXhrHeaders() の例は src/main.ts へ移設 -->
</body>

</html>
