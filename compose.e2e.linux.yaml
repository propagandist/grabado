# イメージ E2E の **Linux だけ**の上書き（HANDOVER §2 / 段階2-5）。
#
#   npm run test:image     # tests/image/compose.ts が platform を見て重ねる。手で叩くことは無い
#
# ★ **なぜ Linux だけか** —— **bind mount の所有権は、ホスト側のものがそのまま見える**。
#   Docker Desktop for Windows / Mac は所有権を偽装するので当たらない（2-1 から 2-4 まで
#   手元で一度も踏まなかった理由）。**Linux では 2 方向に壊れる**:
#
#   1. **コンテナが書けない** —— イメージは非 root（uid 100）で走り、mount 先は
#      テストを回す人の uid。`FileDesignStore` の起動時 fail-fast が
#      `正本ディレクトリに書けない` で止める（段階5-3 の設計どおり）
#   2. **ホストが読めない** —— 1 を回避しても、`Files.createTempFile` が **POSIX 0600** で
#      作ったものを `ATOMIC_MOVE` するので、**保存された JSON は 600・uid 100 所有**になる。
#      テストがホスト側から読むと `EACCES`
#
#   **コンテナをホストと同じ uid で走らせる**と両方消える。値は compose.ts が
#   `TEST_UID` / `TEST_GID` に入れて渡す。
#
# ★★ **これはテストを通すための細工で、利用者の条件とは違う。**
#   利用者が Linux で `docker compose up` すると `schema/` で**同じことが 2 つとも起きる**
#   —— **配布物の側の問題**で、正本は
#   https://github.com/propagandist/grabado/issues/103 が持つ。
#   **この細工がある限り、E2E はその欠陥を捕まえない。**
#   **#103 が配布物を直したら、このファイルごと消す**（消せることが #103 の受け入れ基準）。
#
# ★ **compose.yaml も compose.e2e.yaml も 1 行も触らない** —— 配布の形をテストの都合で
#   曲げないため（issue #93 の判断 4）。**プラットフォーム差はプラットフォーム差の側に閉じる。**

services:
  app:
    user: "${TEST_UID}:${TEST_GID}"
