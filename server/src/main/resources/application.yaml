# 外向きの env 名は HANDOVER §2.4 のものを保ち、内側では型付きの
# @ConfigurationProperties で受ける（テストが値をコンストラクタで作れる＝
# Spring を起動せずに store をテストできる）。
#
# GRABADO_ 前綴りを正とし、裸の一般語（SCHEMA_DIR）も互換で読む。裸の名前だけに
# するのは公開 OSS のコンテナ env として危うい（base image や他プロセスと衝突しうる）。
grabado:
  schema-dir: ${GRABADO_SCHEMA_DIR:${SCHEMA_DIR:/data/schema}}
  # 副作用（保存・introspection・AI）を止める。**公開デモは true 一択**
  # —— AI は API 費用が自社負担、introspection は SSRF の踏み台になるため。
  # 落ちるのはその 3 つだけで、list / load は生きている（読み取りビューア）。
  readonly: ${GRABADO_READONLY:${READONLY:false}}

  # introspection の接続先（段階5-7a）。**既定は空＝無効。**
  #
  # ★ ここに列挙したものしか使えない。`?action=import&database=shop` の `shop` が選ぶのは
  #   このキーだけで、**ホスト名はクライアントから 1 バイトも渡らない** ——
  #   SSRF が「対策」ではなく**不可能**になる。
  #
  # 設定するときは env 経由で（秘密をイメージに焼かない。CLAUDE.md 制約5）:
  #
  #   grabado:
  #     introspect:
  #       sources:
  #         shop:
  #           url: ${SHOP_JDBC_URL}
  #           user: ${SHOP_DB_USER}
  #           password: ${SHOP_DB_PASSWORD}
  #           schema: public
  introspect:
    sources: {}

server:
  tomcat:
    # 日本語の keyword が URL エンコードで往復するのは実測契約（ARCHITECTURE §4.3）。
    # 既定に任せず明示する。
    uri-encoding: UTF-8

spring:
  application:
    name: grabado
